name: Independent axis animation
stack:
  Create.Position.XYZ:
    X:
      Create.Value.Bezier:
        Start: -4
        Control1: -4
        Control2: 4
        End: 4
        Duration: 8
        Ping Pong: true
    Y: 3
    Z:
      Modify.Value.MapTo:
        Minimum: -3
        Maximum: 3
        in:
          - Create.Value.Random: {Interval: 2, Filter Time: 1, Seed: 17}
