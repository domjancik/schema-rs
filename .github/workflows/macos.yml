name: macOS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: xcrun swiftc -swift-version 5 -O scripts/macos/Launcher.swift -o "$RUNNER_TEMP/Schema-s-launcher"
      - run: python3 tests/macos_package_test.py && python3 tests/public_release_test.py
      - run: node --check web/app.js && node --check web/output-ui.js && node --check web/landing.js
      - run: cargo build --locked
      - run: python3 tests/macos_engine_smoke.py target/debug/schema-rs
  unsigned-preview:
    # No secrets or signing run on untrusted pull requests.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: native-check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup update stable && rustup default stable
      - run: python3 scripts/macos/build_native.py --unsigned-preview --build-number "${{ github.run_number }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal-unsigned
          path: target/macos-build/artifacts/*
          if-no-files-found: error
